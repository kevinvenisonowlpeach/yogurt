packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@ai-sdk/zai": ^3.0.14
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/geist": ^5.3.0
  "@t3-oss/env-core": ^0.13.11
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  ai: ^7.0.106
  class-variance-authority: ^0.7.1
  cn: ^0.3.0
  dotenv: ^18.0.0
  lucide-react: ^1.47.0
  shadcn: ^4.21.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  zhipu-ai-provider: ^0.4.0
  zod: ^4.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.3.3"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.3"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.3"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.3"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.3"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.3"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.3"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.3"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.3"
  - vite-plus@0.3.3
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
